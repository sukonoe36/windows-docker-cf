# .github/workflows/rdp-cf-browser.yml
name: RDP-CF-Browser
run-name: "RDP-CF-Browser #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-rdp:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Enable RDP + create user
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          Restart-Service TermService -Force

          $pass = "Kx9@" + (Get-Random -Minimum 10000000 -Maximum 99999999) + "zQ!"
          $sec = ConvertTo-SecureString $pass -AsPlainText -Force

          if (Get-LocalUser RDP -EA SilentlyContinue) { Remove-LocalUser RDP }
          New-LocalUser -Name RDP -Password $sec -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember Administrators RDP
          Add-LocalGroupMember "Remote Desktop Users" RDP

          "RDP_PASS=$pass" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "RDP user ready — password: $pass"

      - name: Install TightVNC
        shell: pwsh
        run: |
          $msi = Join-Path $env:TEMP "tightvnc.msi"
          Invoke-WebRequest "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" -OutFile $msi
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /qn /norestart ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=vncpass"

          if (-not (Test-Path "C:\Program Files\TightVNC\tvnserver.exe")) {
            throw "TightVNC installation failed"
          }

          & "C:\Program Files\TightVNC\tvnserver.exe" -start
          Start-Sleep 3
          Write-Host "TightVNC installed and started"

      - name: Enable TightVNC loopback + restart
        shell: pwsh
        run: |
          $regPath = "HKLM:\SOFTWARE\TightVNC\Server"
          if (-not (Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
          Set-ItemProperty -Path $regPath -Name "AllowLoopback" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $regPath -Name "LoopbackOnly" -Value 0 -Type DWord -Force

          & "C:\Program Files\TightVNC\tvnserver.exe" -stop
          Start-Sleep 2
          & "C:\Program Files\TightVNC\tvnserver.exe" -start
          Start-Sleep 3
          Write-Host "Loopback enabled and VNC restarted"

      - name: Install noVNC + websockify
        shell: pwsh
        run: |
          pip install websockify --quiet
          if (-not (Test-Path "$env:USERPROFILE\noVNC")) {
            git clone --depth 1 https://github.com/novnc/noVNC.git "$env:USERPROFILE\noVNC"
          }
          Write-Host "noVNC ready"

      - name: Start websockify
        shell: pwsh
        run: |
          Start-Process -FilePath "websockify.exe" -ArgumentList @("--web", "$env:USERPROFILE\noVNC", "6080", "localhost:5900") -PassThru -NoNewWindow
          Start-Sleep 4
          Write-Host "websockify on 6080"

      - name: Install cloudflared
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "cloudflared.exe"
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $exe
          & $exe --version

      - name: Start Cloudflare tunnel
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "cloudflared.exe"
          $out = Join-Path $env:RUNNER_TEMP "cf.out"
          $err = Join-Path $env:RUNNER_TEMP "cf.err"

          Remove-Item $out, $err -ErrorAction SilentlyContinue

          $proc = Start-Process -FilePath $exe `
            -ArgumentList "tunnel --no-autoupdate --url http://localhost:6080" `
            -RedirectStandardOutput $out `
            -RedirectStandardError $err `
            -PassThru -NoNewWindow

          $url = $null
          for ($i = 1; $i -le 60; $i++) {
            Start-Sleep 2
            $log = (Get-Content $out, $err -Raw -ErrorAction SilentlyContinue) -join "`n"
            if ($log -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
              $url = $Matches[0]
              break
            }
          }

          if (-not $url) {
            Get-Content $out, $err -ErrorAction SilentlyContinue
            throw "Failed to get tunnel URL"
          }

          "TUNNEL_URL=$url" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Tunnel is up: $url"

      - name: Print browser link
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " BROWSER LINK"
          Write-Host "=========================================="
          Write-Host "$env:TUNNEL_URL/vnc.html?autoconnect=true&password=vncpass"
          Write-Host "VNC password : vncpass"
          Write-Host "Windows user : RDP"
          Write-Host "Windows pass : $env:RDP_PASS"
          Write-Host "=========================================="
