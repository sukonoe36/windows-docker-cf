# .github/workflows/rdp-cf-browser.yml
name: RDP-CF-Browser
run-name: "RDP-CF-Browser #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-rdp:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Enable RDP + create user
        run: |
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

          # Create user
          $pass = -join ((48..57 + 65..90 + 97..122) | Get-Random -Count 16 | ForEach-Object {[char]$_})
          $sec = ConvertTo-SecureString $pass -AsPlainText -Force
          if (Get-LocalUser RDP -ErrorAction SilentlyContinue) { Remove-LocalUser RDP }
          New-LocalUser -Name RDP -Password $sec -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group Administrators -Member RDP
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member RDP

          "RDP_PASS=$pass" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "User RDP created"

      - name: Install TightVNC
        run: |
          $url = "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"
          Invoke-WebRequest $url -OutFile tightvnc.msi
          Start-Process msiexec -ArgumentList "/i tightvnc.msi /quiet /norestart ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=vncpass SET_ACCEPTHTTPCONNECTIONS=1 VALUE_OF_ACCEPTHTTPCONNECTIONS=1" -Wait
          Write-Host "TightVNC installed"

      - name: Start TightVNC Server
        run: |
          & "C:\Program Files\TightVNC\tvnserver.exe" -start
          Start-Sleep 3
          Write-Host "VNC server started on 5900"

      - name: Install noVNC + websockify
        run: |
          # websockify (python)
          pip install websockify --quiet

          # noVNC
          git clone --depth 1 https://github.com/novnc/noVNC.git $env:USERPROFILE\noVNC
          Write-Host "noVNC ready"

      - name: Start noVNC
        run: |
          Start-Process powershell -ArgumentList "-Command", "websockify --web $env:USERPROFILE\noVNC 6080 localhost:5900" -WindowStyle Hidden
          Start-Sleep 4
          Write-Host "noVNC listening on 6080"

      - name: Install cloudflared + start tunnel
        run: |
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile cloudflared.exe

          Remove-Item cf.log -ErrorAction SilentlyContinue
          Start-Process -FilePath .\cloudflared.exe -ArgumentList "tunnel --no-autoupdate --url http://localhost:6080" -RedirectStandardOutput cf.log -RedirectStandardError cf.err -NoNewWindow

          $url = $null
          for ($i=1; $i -le 40; $i++) {
            Start-Sleep 2
            $log = Get-Content cf.log,cf.err -Raw -ErrorAction SilentlyContinue
            if ($log -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
              $url = $Matches[0]
              break
            }
            if ($i % 5 -eq 0) { Write-Host "waiting tunnel... $i" }
          }

          if (-not $url) {
            Get-Content cf.log,cf.err
            Write-Error "No tunnel URL"
            exit 1
          }

          "TUNNEL_URL=$url" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Tunnel: $url"

      - name: Print browser link
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " OPEN THIS IN YOUR BROWSER"
          Write-Host "=========================================="
          Write-Host "$env:TUNNEL_URL/vnc.html?autoconnect=true&password=vncpass"
          Write-Host "=========================================="
          Write-Host "VNC password: vncpass"
          Write-Host "Windows user: RDP"
          Write-Host "Windows pass: $env:RDP_PASS"
          Write-Host "=========================================="

      - name: Keep alive
        run: |
          while ($true) {
            Start-Sleep 300
            Write-Host "[$(Get-Date)] still alive → $env:TUNNEL_URL"
          }
