# .github/workflows/windows-cf.yml
name: Windows + Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tunnel:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Start simple HTTP server on 8080
        run: |
          $code = @'
          $listener = New-Object System.Net.HttpListener
          $listener.Prefixes.Add("http://+:8080/")
          $listener.Start()
          Write-Host "Listening on 8080"
          while ($listener.IsListening) {
            $ctx = $listener.GetContext()
            $res = $ctx.Response
            $html = "<h1>Windows runner is up</h1><p>GitHub Actions + Cloudflare Tunnel</p>"
            $buf = [System.Text.Encoding]::UTF8.GetBytes($html)
            $res.ContentLength64 = $buf.Length
            $res.ContentType = "text/html"
            $res.OutputStream.Write($buf, 0, $buf.Length)
            $res.Close()
          }
          '@
          Start-Process powershell -ArgumentList "-Command", $code -WindowStyle Hidden
          Start-Sleep -Seconds 3

      - name: Install cloudflared
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile cloudflared.exe

      - name: Start Cloudflare tunnel
        run: |
          Start-Process -FilePath ".\cloudflared.exe" `
            -ArgumentList "tunnel --no-autoupdate --url http://localhost:8080" `
            -RedirectStandardOutput "cf.log" `
            -RedirectStandardError "cf.err" `
            -NoNewWindow

          $url = $null
          for ($i = 1; $i -le 40; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path cf.log) {
              $txt = Get-Content cf.log -Raw -ErrorAction SilentlyContinue
              if ($txt -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                $url = $Matches[0]
                break
              }
            }
            Write-Host "waiting for tunnel... $i"
          }

          if (-not $url) {
            Get-Content cf.log -ErrorAction SilentlyContinue
            Get-Content cf.err -ErrorAction SilentlyContinue
            Write-Error "No tunnel URL"
            exit 1
          }

          echo "TUNNEL_URL=$url" >> $env:GITHUB_ENV
          Write-Host "Tunnel ready: $url"

      - name: Print URL
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " OPEN THIS"
          Write-Host "========================================"
          Write-Host $env:TUNNEL_URL
          Write-Host "========================================"

      - name: Keep alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 300
            Write-Host "[$(Get-Date -Format o)] still up → $env:TUNNEL_URL"
          }
