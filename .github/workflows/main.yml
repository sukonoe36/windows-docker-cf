# .github/workflows/rdp-cf-browser.yml
name: RDP-CF-Browser
run-name: "RDP-CF-Browser #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-rdp:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Enable RDP + create user
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          Restart-Service TermService -Force

          $pass = -join ((48..57 + 65..90 + 97..122) | Get-Random -Count 14 | ForEach-Object {[char]$_})
          $sec = ConvertTo-SecureString $pass -AsPlainText -Force
          if (Get-LocalUser RDP -EA SilentlyContinue) { Remove-LocalUser RDP }
          New-LocalUser -Name RDP -Password $sec -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember Administrators RDP
          Add-LocalGroupMember "Remote Desktop Users" RDP
          "RDP_PASS=$pass" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "RDP user ready"

      - name: Install TightVNC
        run: |
          Invoke-WebRequest "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi" -OutFile tvn.msi
          Start-Process msiexec -ArgumentList "/i tvn.msi /quiet /norestart ADDLOCAL=Server SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=vncpass" -Wait
          Start-Sleep 2
          & "C:\Program Files\TightVNC\tvnserver.exe" -start
          Start-Sleep 3
          Write-Host "TightVNC running"

      - name: Install noVNC + websockify
        run: |
          pip install websockify --quiet
          git clone --depth 1 https://github.com/novnc/noVNC.git $env:USERPROFILE\noVNC
          Write-Host "noVNC ready"

      - name: Start websockify
        run: |
          Start-Process powershell -ArgumentList "-WindowStyle Hidden -Command websockify --web $env:USERPROFILE\noVNC 6080 localhost:5900" -WindowStyle Hidden
          Start-Sleep 4
          Write-Host "websockify on 6080"

      - name: Install cloudflared
        run: |
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile cloudflared.exe
          .\cloudflared.exe --version

      - name: Start and maintain Cloudflare tunnel
        run: |
          function Start-Tunnel {
            Remove-Item cf.out, cf.err -EA SilentlyContinue
            $p = Start-Process -FilePath .\cloudflared.exe `
              -ArgumentList "tunnel --no-autoupdate --url http://localhost:6080" `
              -RedirectStandardOutput cf.out -RedirectStandardError cf.err `
              -PassThru -NoNewWindow
            return $p
          }

          $proc = Start-Tunnel
          $url = $null

          # Wait for first URL
          for ($i = 1; $i -le 50; $i++) {
            Start-Sleep 2
            $log = (Get-Content cf.out, cf.err -Raw -EA SilentlyContinue) -join "`n"
            if ($log -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
              $url = $Matches[0]
              break
            }
            if ($i % 5 -eq 0) { Write-Host "waiting for tunnel... $i" }
          }

          if (-not $url) {
            Get-Content cf.out, cf.err -EA SilentlyContinue
            Write-Error "Failed to get tunnel URL"
            exit 1
          }

          "TUNNEL_URL=$url" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Tunnel is up: $url"

          # Keep the tunnel alive and restart if it dies
          while ($true) {
            if ($proc.HasExited) {
              Write-Host "cloudflared died – restarting..."
              $proc = Start-Tunnel
              Start-Sleep 8
            }
            Write-Host "[$(Get-Date -Format o)] alive → $url"
            Start-Sleep 120
          }

      - name: Print link (this runs in parallel conceptually but we print early)
        run: |
          # This step is just for visibility; the real keep-alive is above
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " BROWSER LINK"
          Write-Host "=========================================="
          Write-Host "$env:TUNNEL_URL/vnc.html?autoconnect=true&password=vncpass"
          Write-Host "VNC password : vncpass"
          Write-Host "Windows user : RDP"
          Write-Host "Windows pass : $env:RDP_PASS"
          Write-Host "=========================================="
